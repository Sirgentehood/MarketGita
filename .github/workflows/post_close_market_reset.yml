name: Post Close Market Reset

on:
  workflow_dispatch:
  schedule:
    # 4:00 PM IST = 10:30 AM UTC, Monday-Friday
    - cron: "30 10 * * 1-5"

permissions:
  contents: write

jobs:
  post-close-market-reset:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Download Yahoo data
        run: |
          python yahoo_data_downloader.py

      - name: Run VCP engine
        run: |
          python run_post_close_pipeline.py

      - name: Commit and push outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add outputs/

          if git diff --cached --quiet; then
            echo "No output changes to commit"
            exit 0
          fi

          git commit -m "Update post-close market outputs"

          git pull --rebase origin main
          git push origin main
