name: Post Close Market Reset

on:
  schedule:
    - cron: "30 9 * * 1-5" # 4:00 PM IST
  workflow_dispatch:

permissions:
  contents: write

jobs:
  market-reset:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Create folders
        run: |
          mkdir -p outputs
          mkdir -p data/yahoo_prices

      - name: Download Yahoo data
        run: |
          python yahoo_data_downloader.py \
            --universe data/universe_2026.csv \
            --outdir data/yahoo_prices \
            --period 24mo \
            --market-index "^NSEI"

      - name: Run VCP engine
        run: |
          python vcp_engine.py \
            --universe data/universe_2026.csv \
            --wide-price data/yahoo_prices \
            --outdir outputs \
            --chart-scope dashboard

      - name: Commit and push updated outputs
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git add outputs/
          git add data/yahoo_prices/

          git commit -m "Daily market update" || echo "No changes to commit"

          git pull --rebase origin main
          git push origin HEAD:main
